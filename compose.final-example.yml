# Legacy Ollama example after cutover. Raw Ollama should have no LAN
# ports mapping; clients should use 11434 on this router and humans should use
# the separate 11435 admin portal.
services:
  ai-router:
    build:
      context: .
    image: "${ROUTER_IMAGE:-llm-router:latest}"
    container_name: "${ROUTER_CONTAINER_NAME:-llm-router}"
    restart: unless-stopped
    ports:
      # 11434 = Ollama-compatible router API.
      - "${ROUTER_BIND_IP:-192.168.1.21}:11434:11434"
      # 11435 = unauthenticated human admin portal.
      - "${ROUTER_BIND_IP:-192.168.1.21}:${ADMIN_PUBLIC_PORT:-11435}:${ADMIN_PORT:-11435}"
    environment:
      HOST: "0.0.0.0"
      PORT: "11434"
      ADMIN_ENABLED: "${ADMIN_ENABLED:-true}"
      ADMIN_BIND_HOST: "${ADMIN_BIND_HOST:-0.0.0.0}"
      ADMIN_PORT: "${ADMIN_PORT:-11435}"
      OLLAMA_UPSTREAM_URL: "http://ollama-backend:11434"
      RESPONSES_CONTEXT_SHIFT: "${RESPONSES_CONTEXT_SHIFT:-false}"
      ACTIVE_MODEL_FILE: "/app/runtime/active-model.json"
      ROUTER_MODEL_ALIAS: "${ROUTER_MODEL_ALIAS:-local-active}"
      ROUTER_MODEL_METADATA_TTL_MS: "${ROUTER_MODEL_METADATA_TTL_MS:-5000}"
      MODEL_POLICY_MODE: "active-only"
      REWRITE_REQUESTED_MODEL_TO_ACTIVE: "${REWRITE_REQUESTED_MODEL_TO_ACTIVE:-false}"
      FORCE_KEEP_ALIVE: "-1"
      DEFAULT_THINK: "${DEFAULT_THINK:-}"
      UNSUPPORTED_TOOLS_POLICY: "${UNSUPPORTED_TOOLS_POLICY:-passthrough}"
      ALLOW_MODEL_MANAGEMENT: "${ALLOW_MODEL_MANAGEMENT:-false}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-change-me-before-lan-exposure}"
      DATA_DIR: "/app/data"
      REQUEST_HISTORY_LIMIT: "${REQUEST_HISTORY_LIMIT:-500}"
      EVENT_HISTORY_LIMIT: "${EVENT_HISTORY_LIMIT:-500}"
      REQUEST_LOG_MAX_BYTES: "${REQUEST_LOG_MAX_BYTES:-5242880}"
      EVENT_LOG_MAX_BYTES: "${EVENT_LOG_MAX_BYTES:-5242880}"
      GENERATION_RETENTION_DAYS: "${GENERATION_RETENTION_DAYS:-7}"
      GENERATION_MAX_BYTES: "${GENERATION_MAX_BYTES:-1073741824}"
      MAX_BODY_BYTES: "${MAX_BODY_BYTES:-0}"
    volumes:
      - ./data:/app/data
      - ./runtime:/app/runtime
      - ${UNIFIED_MODELS_DIR:-/home/astigmatism/ai-models}:/models:ro
    networks:
      local-ai-llm-legacy_default:
        aliases:
          - ai-router
          # Add this only after raw Ollama is renamed to ollama-backend or loses this alias.
          # - ollama

networks:
  local-ai-llm-legacy_default:
    external: true
